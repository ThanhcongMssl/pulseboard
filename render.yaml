# Render Blueprint for the free hosted demo: api + worker in one free web
# service (Render's free tier has no background workers; see the `all` stage
# in the Dockerfile) and a free Key Value instance for BullMQ and pub/sub.
# MongoDB is an Atlas free cluster and the dashboard runs on Vercel; their
# URLs are entered once when the Blueprint is created (sync: false).

services:
  - type: web
    name: pulseboard-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy each push to main once its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: MONGO_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulseboard-redis
          property: connectionString
      - key: API_PORT
        value: 10000
      # Keep 90 days built: at boot, queue any day missing or built by an older
      # DATA_VERSION (so the first boot seeds, and a version bump re-seeds).
      - key: SEED_DAYS
        value: 90
      - key: INGEST_EVERY_MINUTES
        value: 360

  - type: keyvalue
    name: pulseboard-redis
    plan: free
    region: singapore
    # BullMQ requires noeviction, so queued jobs are never dropped.
    maxmemoryPolicy: noeviction
    # Private network only.
    ipAllowList: []
