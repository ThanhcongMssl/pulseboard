name: pulseboard

services:
  mongo:
    # Pinned: earlier 8.x/9.x builds refuse to start on Linux kernels 6.19+
    # (SERVER-121912), which CI runners now use; 9.0.4 has the fix.
    image: mongo:9.0.4
    # Single-node replica set: multi-document transactions require one.
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/healthcheck.js:/healthcheck.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '/healthcheck.js']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction so queued jobs are never evicted.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
      start_interval: 1s

  # The apps, built from the root Dockerfile. `pnpm db:up` starts only mongo
  # and redis for the host dev loop (`pnpm dev`), which uses the same ports.
  api:
    build: { context: ., target: api }
    environment: &app-env
      MONGO_URL: mongodb://mongo:27017/pulseboard?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:3000
    ports:
      - '127.0.0.1:4000:4000'
    depends_on: &infra
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  worker:
    build: { context: ., target: worker }
    environment:
      <<: *app-env
      INGEST_EVERY_MINUTES: ${INGEST_EVERY_MINUTES:-360}
      CONNECTOR_FAILURE_RATE: ${CONNECTOR_FAILURE_RATE:-0}
    depends_on: *infra

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
